services:
    app:
      build: .
      ports:
        - "8000:8000"
      environment:
        - ENVIRONMENT=dev
      depends_on:
        - db

    db:
      image: postgres:16-alpine
      environment:
        - POSTGRES_USER=payflow
        - POSTGRES_PASSWORD=payflow
        - POSTGRES_DB=payflow
      ports:
        - "5432:5432"
      volumes:
        - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
